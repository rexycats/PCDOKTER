.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
input[type=text],input[type=number],select{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;max-width:100%}
input.bad{border-color:var(--bad)} input.good{border-color:var(--good)}

.fb.no{background:var(--bad-soft);color:var(--ink)} .fb.no b:first-child{color:var(--bad)}

.ordersel{display:flex;flex-wrap:wrap;gap:8px}

.progress{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}

.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:60px}

.glos{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:6px 18px}
.glos dt{font-weight:800} .glos dd{margin:0;color:var(--ink-2)}

.chaps{display:flex;flex-wrap:wrap;gap:8px}

.tj{display:flex;flex-direction:column;gap:12px}
.lockbox{background:var(--warn-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}

.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fb,.st{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
/* nagebootst Taakbeheer-venster */
.tm{background:#FFFFFF;color:#1B1B1B;border:1px solid #C9C9C9;border-radius:8px;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;max-width:640px}
.tm .tmh{background:#F3F3F3;padding:6px 10px;font-weight:600;display:flex;justify-content:space-between;border-bottom:1px solid #DDD}
.tm .tmt{display:flex;gap:2px;padding:0 6px;background:#F3F3F3;border-bottom:1px solid #DDD;overflow-x:auto}
.tm .tmt span{padding:5px 8px;white-space:nowrap;color:#555}
.tm .tmt span.on{color:#000;border-bottom:2px solid #0067C0;font-weight:600}
.tm table{font-size:13px}
.tm th{background:#FFF;font-family:'Segoe UI',Arial,sans-serif;font-weight:400;color:#555;border-bottom:1px solid #DDD}
.tm td,.tm th{padding:5px 8px;border-bottom:1px solid #EEE}
.tm td.n,.tm th.n{text-align:right;font-variant-numeric:tabular-nums}
.tm td.h1{background:#FFF4CC}.tm td.h2{background:#FFE08A}.tm td.h3{background:#F9B65B}

.qtm{margin-top:4px}

.tag.sw{background:var(--blue-soft);color:var(--blue)}.tag.hw{background:var(--accent-soft);color:var(--accent-ink)}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.path{font-weight:700;color:var(--ink)}
</style>

<script>
"use strict";
/* ---------- opslag ---------- */
const KEY='trage-pc-dokter-v2';
let S={naam:'',klas:'',prog:{},unlocked:false,prak:{},toets:null,lastTab:'theorie'};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- hulpjes ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickN(a,n){return shuffle(a).slice(0,n);}
function parseNum(v){const m=String(v==null?'':v).replace(/\s/g,'').replace(',','.').match(/-?\d+(\.\d+)?/);return m?+m[0]:null;}
const nl=n=>String(n).replace('.',',');

const CH={H1:'Oorzaken en prestatie-analyse',H2:'Opstartprogramma\'s, apps en extensies',H3:'Zware programma\'s en te veel tegelijk',H4:'Een verouderde pc',H5:'Updates',H6:'Virussen en soorten malware',H7:'Opstarten: BIOS/UEFI',H8:'Opslag: vol, traag of versleten',H9:'Synchronisatie en cloudopslag',P:'Praktijk: waar zit het probleem?'};

'Opstartprogramma':['Programma dat automatisch mee opstart wanneer je je aanmeldt bij Windows.','H2'],

'Systeemvereisten':['Wat een programma minstens nodig heeft (minimum) of nodig heeft om vlot te werken (aanbevolen).','H3'],

function gloss(opt){let best=null;const o=String(opt).toLowerCase();for(const k in G){const kl=k.toLowerCase();if(o===kl||o.startsWith(kl)||kl.startsWith(o)){if(!best||k.length>best.length)best=k;}}if(!best){for(const k in G){const kl=k.toLowerCase().replace(/ \(.*\)$/,'');if(kl.length>=4&&o.includes(kl)&&(!best||k.length>best.length))best=k;}}return best?G[best][0]:null;}

function mc(prompt,answer,distractors,why,hint,n=2){return {type:'mc',prompt,answer,options:shuffle([answer,...pickN([...new Set(distractors)].filter(d=>d!==answer),n)]),why,hint};}
function fromFacts(facts){const f=rnd(facts);return mc(f.q,f.a,f.d,f.w,f.h,f.n||2);}
function fromGloss(ch){const ks=Object.keys(G).filter(k=>G[k][1]===ch);const k=rnd(ks);const others=ks.filter(x=>x!==k);if(Math.random()<0.5)return mc(`Welk begrip hoort bij: "${G[k][0]}"`,k,others,`${k}: ${G[k][0]}`,'Zoek het sleutelwoord in de omschrijving.');return mc(`Wat betekent: ${k}?`,G[k][0],others.map(x=>G[x][0]),`${k}: ${G[k][0]}`,'Denk aan de uitleg in Theorie.');}
function toMC(q){if(q.type!=='num')return q;const u=q.unit?' '+q.unit:'';const A=nl(q.answer)+u;const ds=[...new Set((q.distr||[]).map(x=>nl(x)+u))].filter(x=>x!==A);
 return {type:'mc',prompt:q.prompt,answer:A,options:shuffle([A,...pickN(ds,3)]),why:q.why,hint:q.hint};}

<h3>Meten is weten: Taakbeheer</h3>
<p>Open Taakbeheer met <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Esc</kbd>. (Met <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>Delete</kbd> kom je eerst op een blauw scherm en kies je daarna Taakbeheer.) De tabbladen <b>Processen</b>, <b>Prestaties</b> en <b>Opstarten</b> gebruik je in bijna elk hoofdstuk.</p>
<h3>Prestatie-analyse: meer tools</h3>
<p>Taakbeheer geeft het overzicht. Voor het detail heeft Windows nog andere tools. Werk altijd van <b>overzicht → detail → oplossing</b>.</p>

<tr><td>Prestatiemeter</td><td><code>perfmon /report</code> (als beheerder)</td><td>Systeemdiagnoserapport na 60 seconden</td></tr>
<tr><td>Systeeminformatie</td><td>startmenu: <code>msinfo32</code></td><td>Hardware, BIOS-versie, Windows-versie</td></tr>

<tr><td>Taakbeheer van de browser</td><td><kbd>Shift</kbd> + <kbd>Esc</kbd> in Chrome of Edge</td><td>Geheugen per tabblad en per extensie, zie H2</td></tr></table></div>

H2:`<p>Veel programma's zetten zichzelf in de lijst van <b>opstartprogramma's</b>: ze starten vanzelf wanneer je je aanmeldt. Hoe meer er zijn, hoe langer het duurt voor je kan werken en hoe meer geheugen ze blijven innemen.</p>
<h3>Uitschakelen in Taakbeheer</h3>
<ol><li>Open Taakbeheer: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Esc</kbd>.</li><li>Kies het tabblad <span class="path">Opstarten</span> (Windows 11: <span class="path">Opstart-apps</span>).</li><li>Klik op de kolom <b>Invloed op opstarten</b> om te sorteren.</li><li>Rechtsklik op een programma → <b>Uitschakelen</b>.</li></ol>

<p>In Windows 11 kan het ook via <span class="path">Instellingen → Apps → Opstarten</span>.</p>
<div class="box vgl"><h4>Wat laat je aan?</h4><p>Beveiliging (antivirus) en programma's die bij hardware horen: geluid (Realtek), touchpad, grafische kaart. Wat schakel je uit? Programma's die je zelf start wanneer je ze nodig hebt: Spotify, Steam, Discord, Teams (als je het niet de hele dag gebruikt) …</p></div>
<h3>Verwijderen en voorkomen</h3>
<ul><li><b>Uitschakelen ≠ verwijderen.</b> Gebruik je een programma nooit? Verwijder het via <span class="path">Instellingen → Apps → Geïnstalleerde apps</span>.</li><li>Nog beter: installeer niets wat je niet nodig hebt. Kies bij gratis software <b>Aangepaste installatie</b> en vink werkbalken en extra programma's (<b>bloatware</b>) uit.</li></ul>
<h3>Apps op de achtergrond</h3>
<ul><li><b>Achtergrond-apps</b> blijven draaien als ze dicht zijn: meldingen, synchroniseren, updates. Beperk ze per app: <span class="path">Instellingen → Apps → Geïnstalleerde apps → ⋯ → Geavanceerde opties → Machtigingen voor achtergrond-apps: Nooit</span> (niet elke app heeft die optie).</li>
<li>Programma's in het <b>systeemvak</b> naast de klok (Steam, Spotify, Discord) draaien door als het venster dicht is: rechtsklik → <b>Afsluiten</b>.</li></ul>
<h3>Browserextensies</h3>
<ul><li>Elke extensie gebruikt geheugen en processor, soms op elk tabblad.</li><li>Druk <kbd>Shift</kbd> + <kbd>Esc</kbd> in Chrome of Edge: het <b>taakbeheer van de browser</b> toont per tabblad en per extensie wat het gebruikt.</li><li>Schakel ongebruikte extensies uit of verwijder ze via <code>chrome://extensions</code> of <code>edge://extensions</code>.</li><li>Zet in de browserinstellingen "apps op de achtergrond blijven uitvoeren als de browser gesloten is" uit.</li></ul>
<div class="box onthoud"><h4>Onthoud</h4><p>Ctrl + Shift + Esc → Opstarten → sorteer op invloed → rechtsklik → Uitschakelen. Beveiliging en drivers laat je aan. Shift + Esc in de browser toont zware extensies.</p></div>`,
H3:`<h3>Té zware programma's</h3>
<p>Elk programma heeft <b>systeemvereisten</b>. <b>Minimum</b>: het programma start. <b>Aanbevolen</b>: het werkt vlot. Vergelijk ze <b>vóór</b> je installeert met je eigen pc (<span class="path">Instellingen → Systeem → Info</span>). Op Android-toestellen doet de Play Store dit meestal automatisch: een app die niet past, vind je er vaak niet eens.</p>
<div class="tbl"><table><tr><th>Onderdeel</th><th>Minimum (voorbeeldspel)</th><th>Aanbevolen</th></tr><tr><td>Processor</td><td>4 kernen</td><td>6 kernen</td></tr><tr><td>RAM</td><td>8 GB</td><td>16 GB</td></tr><tr><td>Grafische kaart</td><td>4 GB videogeheugen</td><td>8 GB videogeheugen</td></tr><tr><td>Opslag</td><td>50 GB vrij, SSD aanbevolen</td><td>50 GB vrij op SSD</td></tr><tr><td>Besturingssysteem</td><td>Windows 10 64-bit</td><td>Windows 11</td></tr></table></div>
<h3>Te veel programma's tegelijk</h3>
<p>Alles wat open staat, gebruikt werkgeheugen (RAM) en processortijd. Is het RAM vol, dan gebruikt Windows een stuk van de schijf als extra geheugen: het <b>wisselbestand</b>. Dat is veel trager, en dan hapert alles.</p>
${tmProc}
<ol><li>Controleer in de taakbalk of in Taakbeheer → <span class="path">Processen</span> wat er allemaal open staat.</li><li>Kijk bovenaan: welke kolom zit bijna op 100 %? Dat is de <b>bottleneck</b>.</li><li>Sluit onnodige programma's en tabbladen. Reageert iets niet meer: rechtsklik → <b>Taak beëindigen</b> (niet-opgeslagen werk is dan weg).</li><li>Blijft het RAM of de processor vol bij gewoon werk? Dan is de hardware te zwak (hoofdstuk H4).</li></ol>
<div class="box onthoud"><h4>Onthoud</h4><p>Eerst totalen bovenaan, dan het programma met de donkerste kleur. RAM vol → wisselbestand → traag.</p></div>`,
H4:`<p>Ook een pc die nooit iets mankeerde, wordt "trager": nieuwe programma's en websites vragen meer, en het besturingssysteem krijgt op een dag geen updates meer.</p>
<h3>Controleer in Taakbeheer → Prestaties</h3>
<ul><li><b>CPU</b>: zit de processor bij gewoon werk (surfen, Word) vaak boven 90 %?</li><li><b>Geheugen</b>: is het RAM bij gewoon werk bijna vol?</li><li><b>Schijf 0</b>: staat er HDD of SSD? Een HDD die vaak 100 % haalt, is de rem.</li><li><b>GPU</b>: haalt de grafische kaart 100 % bij je spel of videobewerking?</li></ul>
<h3>Het besturingssysteem (OS)</h3>
<p>Kijk in <span class="path">Instellingen → Systeem → Info</span> welke Windows-versie je hebt. <b>Windows 10</b> krijgt sinds <b>14 oktober 2025</b> geen gewone gratis ondersteuning meer. Windows 11 vraagt onder meer een recente 64-bit processor, 4 GB RAM, 64 GB opslag, UEFI met Secure Boot en <b>TPM 2.0</b>. Controleer ook of je software met je Windows-versie samenwerkt.</p>
<div class="tbl"><table><tr><th>Probleem</th><th>Beste oplossing</th></tr><tr><td>HDD</td><td>Vervangen door een SSD (grootste winst per euro)</td></tr><tr><td>4 GB RAM, altijd vol</td><td>RAM bijsteken (8 of 16 GB)</td></tr><tr><td>GPU op 100 % in spellen</td><td>Lagere instellingen of betere grafische kaart</td></tr><tr><td>Windows 10, hardware goed</td><td>Overstappen naar Windows 11</td></tr><tr><td>Alles oud, processor 100 % bij YouTube</td><td>Nieuwe pc overwegen</td></tr></table></div>
<div class="box onthoud"><h4>Onthoud</h4><p>Zoek het zwakste onderdeel en kies de goedkoopste oplossing die dat echt oplost.</p></div>`,
H5:`<p>Updates dichten beveiligingslekken en lossen fouten op. Tijdens het downloaden en installeren werkt de pc op de achtergrond en kan hij tijdelijk trager zijn. Een mislukte update kan een pc ook blijvend vertragen.</p>
<ol><li><span class="path">Instellingen → Windows Update → Naar updates zoeken</span>: zoek bewust naar updates voor het OS.</li><li><span class="path">Windows Update → Updategeschiedenis</span>: is er bij vorige updates iets misgegaan? Hier kan je ook een update verwijderen.</li><li><span class="path">Windows Update → Geavanceerde opties</span> → zet <b>Updates voor andere Microsoft-producten ontvangen</b> aan, zodat Office mee bijgewerkt wordt.</li><li>Stel <b>actieve uren</b> in: dan start Windows niet opnieuw op midden in je werk.</li><li>Werk ook je andere programma's bij met een <b>software-updater</b>, bv. <b>winget</b> (zit in Windows: typ <code>winget upgrade --all</code> in Terminal) of Patch My PC.</li></ol>
<div class="box vgl"><h4>Stuurprogramma's (drivers)</h4><p>Drivers laten Windows met hardware praten. Een verouderde driver van bv. de grafische kaart kan de pc trager of onstabiel maken. Je krijgt ze via Windows Update of de website van de fabrikant.</p></div>
<div class="box onthoud"><h4>Onthoud</h4><p>Updates niet uitschakelen, wel slim plannen. Zoeken → geschiedenis → andere Microsoft-producten → andere software.</p></div>`,
H6:`<p><b>Malware</b> (virussen, spyware, adware, cryptominers …) draait ongemerkt op de achtergrond en gebruikt processor, geheugen en internet. Signalen: pop-ups, een andere startpagina, onbekende programma's, een ventilator die voluit draait zonder reden.</p>
<div class="tbl"><table><tr><th>Regel</th><th>Waarom</th></tr>
<tr><td>Installeer slechts één antivirus, of zorg dat er maar één <b>realtime</b> werkt</td><td>Twee realtime scanners controleren elk bestand dubbel en zitten elkaar in de weg: de pc wordt traag.</td></tr>
<tr><td>Gebruik af en toe een tweede scanner als controle</td><td>Een <b>on-demand scanner</b> (bv. Malwarebytes Free, Microsoft Safety Scanner) start je zelf en draait niet continu.</td></tr>
<tr><td>Updaten en regelmatig scannen</td><td>Nieuwe <b>virusdefinities</b> herkennen nieuwe malware. Snelle scan geregeld, volledige scan af en toe.</td></tr>
<tr><td>Uitschakelen alleen als uitzondering</td><td>Loopt een installatie van betrouwbare software vast? Schakel de antivirus kort uit, liefst zonder internetverbinding, en zet hem meteen weer aan.</td></tr></table></div>
<p>In Windows zit <b>Microsoft Defender</b>: <span class="path">Windows-beveiliging → Virus- en bedreigingsbeveiliging</span>. Daar kies je Snelle scan, Volledige scan of Microsoft Defender Offline-scan (na een herstart, voor hardnekkige malware). Installeer je een andere antivirus, dan gaat Defender vanzelf opzij.</p>
<h3>Soorten malware</h3>
<div class="tbl"><table><tr><th>Soort</th><th>Wat doet het?</th><th>Maakt traag?</th></tr>
<tr><td>Virus</td><td>Hecht zich aan bestanden, verspreidt zich als je ze opent</td><td>soms</td></tr>
<tr><td>Worm</td><td>Verspreidt zichzelf over het netwerk</td><td>netwerk traag</td></tr>
<tr><td>Trojaans paard</td><td>Vermomd als nuttig programma</td><td>soms</td></tr>
<tr><td>Spyware</td><td>Bespioneert je, stuurt gegevens door</td><td>ja</td></tr>
<tr><td>Adware</td><td>Pop-ups en reclame</td><td>ja</td></tr>
<tr><td>Ransomware</td><td>Versleutelt je bestanden, vraagt losgeld</td><td>bestanden weg</td></tr>
<tr><td>Cryptominer</td><td>Gebruikt je processor voor cryptomunten</td><td><b>CPU 100 %</b></td></tr>
<tr><td>Ongewenste app (PUP)</td><td>Werkbalken, "pc-optimizers" bij gratis software</td><td>ja</td></tr></table></div>
<p>Zet in <span class="path">Windows-beveiliging → App- en browserbeheer → Bescherming op basis van reputatie</span> de optie <b>Potentieel ongewenste apps blokkeren</b> aan.</p>
<div class="box onthoud"><h4>Onthoud</h4><p>Eén bewaker aan de deur (realtime), af en toe een inspecteur (on-demand), en altijd de nieuwste opsporingsberichten (updates).</p></div>`,
H7:`<p>Bij het aanzetten start eerst de <b>firmware</b> op het moederbord: het <b>BIOS</b> of de moderne opvolger <b>UEFI</b>. Die doet de <b>POST</b> (Power-On Self-Test): een controle van processor, geheugen, schijven en aangesloten toestellen. Daarna zoekt hij de opstartschijf volgens de <b>bootvolgorde</b>.</p>
<ol><li>Aan-knop</li><li>POST door de firmware</li><li>Opstartschijf zoeken (bootvolgorde)</li><li>Windows laden</li><li>Aanmelden</li><li>Opstartprogramma's (H2)</li></ol>
<p>Hoe lang de firmware nodig had, lees je in <span class="path">Taakbeheer → Opstarten → Laatste BIOS-tijd</span>. Enkele seconden is normaal.</p>
<h3>Sneller opstarten via de UEFI</h3>
<ul><li>In de UEFI kom je met <kbd>F2</kbd> of <kbd>Del</kbd> vlak na het aanzetten, of via <span class="path">Instellingen → Systeem → Herstel → Geavanceerde opstart → UEFI-firmware-instellingen</span>.</li><li>Zet <b>Fast Boot</b> aan: de POST slaat tragere controles over. De POST helemaal uitschakelen kan niet.</li><li>Zet de schijf met Windows <b>bovenaan de bootvolgorde</b>, zodat de pc niet eerst USB of het netwerk afzoekt.</li><li>Schakel hardware die je niet gebruikt uit in de UEFI, of haal ze eruit (oude kaarten, usb-sticks, ongebruikte schijven).</li></ul>
<div class="box onthoud"><h4>Let op</h4><p>Neem een foto van de instellingen vóór je iets wijzigt. Gaat het mis, dan zet je alles terug of kies je "Load defaults".</p></div>`,
H8:`<h3>Te trage schijf</h3>
<div class="tbl"><table><tr><th>Soort</th><th>Werking</th><th>Snelheid</th></tr><tr><td>HDD</td><td>Draaiende platen met een leeskop</td><td>Traag</td></tr><tr><td>SSHD</td><td>HDD met een klein stuk flashgeheugen</td><td>Iets sneller</td></tr><tr><td>SATA-SSD</td><td>Flashgeheugen, geen bewegende delen</td><td>Snel</td></tr><tr><td>NVMe-SSD (M.2)</td><td>Flashgeheugen met snelle aansluiting</td><td>Zeer snel</td></tr></table></div>
<p>Een pc met een HDD vervangen door een SSD is vaak de grootste verbetering die je kan doen. Of het een HDD of SSD is, zie je in <span class="path">Taakbeheer → Prestaties → Schijf 0</span>.</p>
<h3>Te weinig ruimte</h3>
<p>Windows heeft vrije ruimte nodig voor updates, tijdelijke bestanden en het wisselbestand. Houd op station C: minstens <b>10 à 15 %</b> vrij. Bereken: <b>vrij ÷ totaal × 100</b>.</p>
<ul><li><b>Schijfopruiming</b>: typ het in het startmenu, kies ook "Systeembestanden opschonen".</li><li><span class="path">Instellingen → Systeem → Opslag</span>: zie wat ruimte inneemt en ruim tijdelijke bestanden op.</li><li>Verwijder programma's die je niet gebruikt en grote bestanden (video's, downloads) die je niet meer nodig hebt.</li></ul>
<div class="box vgl"><h4>Twee misverstanden</h4><p><b>Defragmenteren</b> helpt alleen een HDD. Bij een SSD stuurt Windows automatisch <b>TRIM</b> via "Stations optimaliseren"; zelf defragmenteren is niet nodig.<br><b>Vrije schijfruimte wissen</b> (bv. <code>cipher /w</code>) overschrijft de vrije ruimte zodat verwijderde bestanden niet terug te halen zijn. Goed voor privacy (bv. vóór je een pc weggeeft), maar het maakt de pc niet sneller.</p></div>
<h3>Is de schijf nog gezond?</h3>
<p>Een HDD slijt: de platen draaien en de leeskop beweegt. Ook een SSD heeft een beperkte levensduur. Signalen: <b>klikkende of schurende geluiden</b>, bestanden die heel traag openen, foutmeldingen bij kopiëren, vastlopers.</p>
<ul><li>Elke schijf houdt een gezondheidsrapport bij: <b>SMART</b>. Het gratis programma <b>CrystalDiskInfo</b> leest dat: <b>Goed</b>, <b>Let op</b> of <b>Slecht</b>.</li>
<li><b>Foutcontrole</b>: <span class="path">Verkenner → rechtsklik C: → Eigenschappen → Extra → Controleren</span> (of <code>chkdsk</code>).</li>
<li>Let op of Slecht? <b>Eerst een back-up</b>, dan de schijf vervangen, liefst door een SSD.</li>
<li>Een HDD defragmenteren helpt wél; Windows doet het wekelijks zelf via "Stations optimaliseren".</li></ul>
<div class="box onthoud"><h4>Onthoud</h4><p>HDD → SSD. Minstens 10 à 15 % vrij. Defragmenteren alleen bij een HDD. Klikgeluiden of "Let op" = eerst back-up.</p></div>`,
H9:`<p><b>OneDrive</b>, <b>Google Drive</b>, <b>Dropbox</b> en <b>iCloud</b> synchroniseren: ze houden dezelfde bestanden gelijk op je pc en in de cloud. Elke wijziging wordt geüpload of gedownload. Dat kost <b>internet, schijf en processor</b>.</p>
<div class="box vgl"><h4>Vergelijk: een koerier</h4><p>Een koerier brengt elk pakje dat je wijzigt naar het depot (de cloud) en haalt nieuwe pakjes op. Bij één pakje merk je niets. Bij 4 000 foto's staat de gang vol dozen.</p></div>
<h3>Wanneer maakt synchronisatie je pc traag?</h3>
<ul><li>de eerste synchronisatie, of na het kopiëren van duizenden foto's of grote video's;</li><li>twee sync-apps tegelijk, of dezelfde map in twee apps;</li><li>een volle schijf, omdat alles ook lokaal gedownload wordt.</li></ul>
<h3>Wat kan je doen?</h3>
<ol><li><b>Onderbreken</b>: OneDrive-wolkje in het systeemvak → tandwiel → <span class="path">Synchronisatie onderbreken</span> → 2, 8 of 24 uur.</li>
<li><b>Mappen kiezen</b>: <span class="path">OneDrive → Instellingen → Account → Mappen kiezen</span>; grote mappen niet naar deze pc.</li>
<li><b>Bestanden op aanvraag</b> aan (standaard aan): bestanden nemen pas ruimte in als je ze opent. Rechtsklik → <b>Ruimte vrijmaken</b> zet ze terug naar alleen online. <b>Opslagsensor</b> (<span class="path">Instellingen → Systeem → Opslag</span>) kan dat automatisch.</li>
<li>Eén sync-app per map, en wat je niet gebruikt laat je niet meestarten (H2).</li></ol>
<div class="tbl"><table><tr><th>Icoontje in Verkenner (kolom Status)</th><th>Betekenis</th></tr>
<tr><td>Blauw wolkje</td><td>Alleen online, neemt geen ruimte in</td></tr>
<tr><td>Wit rondje met groen vinkje</td><td>Lokaal beschikbaar: geopend en gedownload</td></tr>
<tr><td>Groen rondje met wit vinkje</td><td>Altijd behouden op dit apparaat</td></tr>
<tr><td>Twee blauwe pijlen in een cirkel</td><td>Bezig met synchroniseren</td></tr></table></div>
<div class="box onthoud"><h4>Onthoud</h4><p>Synchronisatie is <b>geen back-up</b>: verwijder je een bestand, dan verdwijnt het overal. Ook een fout of door ransomware versleutelde bestanden worden mee gesynchroniseerd.</p></div>`};
/* ---------- weergave ---------- */
let TAB='theorie', CUR={ex:'E1',ch:'H1'};
function setTab(t){if(!['theorie','oefenen','praktijk','toets'].includes(t))t='theorie';TAB=t;S.lastTab=t;save();
 document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false'));
 try{history.replaceState(null,'','#'+t);}catch(e){}
 render();window.scrollTo(0,0);}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function updLock(){$('#tabLock').textContent=toetsOpen()?'open':'op slot';}
function render(){updLock();const m=$('#main');
 if(S.toets&&!S.toets.finished&&TAB!=='toets'){m.innerHTML=`<section class="panel"><h2>Je eindtoets is bezig</h2><p class="lead">Theorie, Oefenen en Praktijk zijn gesloten tot je inlevert. Het rapport toont hoe vaak je de toets verlaten hebt.</p><div><button class="btn acc" type="button" id="backT">Terug naar de toets</button></div></section>`;$('#backT').onclick=()=>setTab('toets');return;}
 if(TAB==='theorie')m.innerHTML=renderTheorie();
 else if(TAB==='oefenen'){m.innerHTML=renderOefenen();bindOefenen();}
 else if(TAB==='praktijk'){m.innerHTML=renderPraktijk();bindPraktijk();}
 else {m.innerHTML=renderToets();bindToets();}
 if(TAB==='theorie')bindTheorie();}

/* Theorie */
function renderTheorie(){const c=CUR.ch;
 const nav=Object.keys(TH).map(k=>`<button class="navbtn" data-ch="${k}" aria-current="${k===c}"><span><small>${k}</small>${CH[k]}</span></button>`).join('')+`<button class="navbtn" data-ch="W" aria-current="${c==='W'}"><span><small>Alles</small>Woordenlijst</span></button>`;
 let body;
 if(c==='W'){body=`<p class="eyebrow">Woordenlijst</p><h2>Alle begrippen</h2><input type="text" id="gSearch" placeholder="Zoek een begrip, bv. bootvolgorde" aria-label="Zoek in de woordenlijst"><dl class="glos" id="gList">${glosHTML('')}</dl>`;}
 else{const tj=TJ[c].map((t,i)=>{const opts=shuffle([t[1],...t[2]]);return `<div class="q" data-tj="${i}"><p class="prompt">${esc(t[0])}</p><div class="opts">${opts.map(o=>`<button class="opt" data-a="${esc(o)}" data-ok="${o===t[1]}">${esc(o)}</button>`).join('')}</div><div class="fbx"></div></div>`;}).join('');
  const words=Object.keys(G).filter(k=>G[k][1]===c);
  body=`<p class="eyebrow">${c} · Theorie</p><h2>${CH[c]}</h2><div class="prose">${TH[c]}</div><h3>Test jezelf</h3><div class="tj">${tj}</div><h3>Woordenlijst ${c}</h3><dl class="glos">${words.map(k=>`<dt>${esc(k)}</dt><dd>${esc(G[k][0])}</dd>`).join('')}</dl>`;}
 return `<div class="split"><nav class="side" aria-label="Hoofdstukken">${nav}</nav><section class="panel">${body}</section></div>`;}
function glosHTML(f){f=f.toLowerCase();return Object.keys(G).sort((a,b)=>a.localeCompare(b,'nl')).filter(k=>!f||k.toLowerCase().includes(f)||G[k][0].toLowerCase().includes(f)).map(k=>`<dt>${esc(k)} <span class="small">${G[k][1]}</span></dt><dd>${esc(G[k][0])}</dd>`).join('')||'<dd>Niets gevonden. Probeer een ander woord.</dd>';}
function bindTheorie(){document.querySelectorAll('.side .navbtn').forEach(b=>b.onclick=()=>{CUR.ch=b.dataset.ch;render();});
 const s=$('#gSearch');if(s)s.oninput=()=>{$('#gList').innerHTML=glosHTML(s.value);};
 document.querySelectorAll('.tj .q').forEach(q=>q.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{const ok=o.dataset.ok==='true';q.querySelectorAll('.opt').forEach(x=>{x.classList.remove('right','wrong');if(x.dataset.ok==='true'&&ok)x.classList.add('right');});o.classList.add(ok?'right':'wrong');
  const right=[...q.querySelectorAll('.opt')].find(x=>x.dataset.ok==='true').dataset.a;q.querySelector('.fbx').innerHTML=ok?`<div class="fb ok"><b>Juist!</b></div>`:`<div class="fb no"><b>Nog niet.</b> ${gloss(o.dataset.a)?esc(o.dataset.a)+': '+esc(gloss(o.dataset.a))+' ':''}Probeer opnieuw of lees de uitleg hierboven.</div>`;}));}

/* Oefenen */
const Q={}; // huidige opgave per oefening
const RECENT={};
function newQ(id){const e=EX.find(x=>x.id===id);let q,tries=0;RECENT[id]=RECENT[id]||[];
 do{q=e.gen();tries++;}while(RECENT[id].includes(q.prompt)&&tries<12);
 RECENT[id].push(q.prompt);if(RECENT[id].length>6)RECENT[id].shift();
 q.state={sel:null,order:[],done:false,shown:false,hintShown:false};Q[id]=q;return q;}
function renderOefenen(){const e=EX.find(x=>x.id===CUR.ex);const q=Q[e.id]||newQ(e.id);
 const nav=EX.map(x=>{const n=okCount(x.id);return `<button class="navbtn" data-ex="${x.id}" aria-current="${x.id===e.id}"><span><small>${x.ch==='mix'?'Alles':x.ch==='P'?'Praktijk':x.ch} · verplicht</small>${esc(x.title)}</span><span class="pill ${n>=NEED?'ok':'todo'}">${n>=NEED?'✓ ':''}${Math.min(n,99)}/${NEED}</span></button>`;}).join('');
 const done=REQ.filter(id=>okCount(id)>=NEED).length;
 const vbSteps=e.vb.map((s,i)=>`<p class="st" ${i>0?'hidden':''} data-st="${i}">${esc(s)}</p>`).join('');
 return `<p class="lead" style="margin-bottom:14px">Maak elke oefening tot je <b>minstens ${NEED} juiste antwoorden</b> hebt. Dan gaat de eindtoets open. Je hebt nu <b>${done} van ${REQ.length}</b> oefeningen klaar.</p>
 <div class="progress" style="margin-bottom:20px" aria-label="Voortgang"><i style="width:${Math.round(done/REQ.length*100)}%"></i></div>

 <div class="q" id="qBox">${renderQ(q,e)}</div></section></div>`;}
function renderQ(q,e){let inp='';
 if(q.type==='mc')inp=`<div class="opts">${q.options.map(o=>`<button class="opt" type="button" data-o="${esc(o)}" aria-pressed="${q.state.sel===o}">${esc(o)}</button>`).join('')}</div>`;
 else if(q.type==='num')inp=`<div class="row"><input type="text" id="qIn" inputmode="decimal" autocomplete="off" aria-label="Jouw antwoord" style="width:180px"><span>${esc(q.unit||'')}</span></div>`;
 else if(q.type==='text')inp=`<div class="row"><input type="text" id="qIn" autocomplete="off" placeholder="${esc(q.placeholder||'')}" aria-label="Jouw antwoord" style="width:220px"></div>`;
 else if(q.type==='order'){q.state.pool=q.state.pool||shuffle(q.items);inp=`<ol class="chosen" id="chosen">${q.state.order.map(i=>`<li>${esc(i)}</li>`).join('')}</ol><div class="ordersel">${q.state.pool.map(i=>`<button type="button" data-i="${esc(i)}" ${q.state.order.includes(i)?'disabled':''}>${esc(i)}</button>`).join('')}</div><div><button class="btn ghost" type="button" id="ordClear">Wis volgorde</button></div>`;}
 return `${q.from?`<p class="small">Uit: ${esc(q.from)}</p>`:''}<p class="prompt">${q.type==='mc'&&q.prompt.includes('<br>')?q.prompt:esc(q.prompt).replace(/&lt;b&gt;|&lt;\/b&gt;/g,m=>m.includes('/')?'</b>':'<b>')}</p>${inp}
 <div class="row"><button class="btn acc" type="button" id="qCheck">Controleer</button><button class="btn ghost" type="button" id="qHint">Hint</button><button class="btn ghost" type="button" id="qSol">Toon oplossing</button><button class="btn ghost" type="button" id="qNew">Nieuwe opgave</button></div><div id="qFb" aria-live="polite"></div>`;}
function bindOefenen(){document.querySelectorAll('.side .navbtn').forEach(b=>b.onclick=()=>{CUR.ex=b.dataset.ex;render();});
 const e=EX.find(x=>x.id===CUR.ex);let vbI=0;const nx=$('#vbNext');
 if(nx){nx.onclick=()=>{vbI=Math.min(vbI+1,e.vb.length-1);document.querySelectorAll('.stepper .st').forEach(s=>s.hidden=+s.dataset.st>vbI);if(vbI===e.vb.length-1)nx.disabled=true;};$('#vbReset').onclick=()=>{vbI=0;nx.disabled=false;document.querySelectorAll('.stepper .st').forEach(s=>s.hidden=+s.dataset.st>0);};}
 bindQ(e);}
function bindQ(e){const q=Q[e.id];const box=$('#qBox');
 box.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(q.state.done)return;q.state.sel=o.dataset.o;box.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===o?'true':'false'));});
 box.querySelectorAll('.ordersel button').forEach(b=>b.onclick=()=>{if(q.state.done)return;q.state.order.push(b.dataset.i);rerenderQ(e);});
 const oc=$('#ordClear');if(oc)oc.onclick=()=>{if(q.state.done)return;q.state.order=[];rerenderQ(e);};
 const inp=$('#qIn');if(inp)inp.onkeydown=ev=>{if(ev.key==='Enter')$('#qCheck').click();};
 $('#qCheck').onclick=()=>checkQ(e);
 $('#qHint').onclick=()=>{q.state.hintShown=true;$('#qFb').innerHTML=`<div class="fb hint"><b>Hint:</b> ${esc(q.hint)}</div>`;};
 $('#qSol').onclick=()=>{q.state.shown=true;q.state.done=true;$('#qFb').innerHTML=`<div class="fb sol"><b>Oplossing:</b> ${esc(ansText(q))}<br>${esc(q.why)}<br><span class="small">Een getoonde oplossing telt niet als juist. Klik op "Nieuwe opgave".</span></div>`;markMC(q,box);};
 $('#qNew').onclick=()=>{newQ(e.id);rerenderQ(e);};}
function rerenderQ(e){$('#qBox').innerHTML=renderQ(Q[e.id],e);bindQ(e);}
function ansText(q){return q.type==='order'?q.items.map((x,i)=>(i+1)+'. '+x).join('  '):q.type==='num'?nl(q.answer)+(q.unit?' '+q.unit:''):String(q.answer);}
function markMC(q,box){if(q.type!=='mc')return;box.querySelectorAll('.opt').forEach(x=>{if(x.dataset.o===q.answer)x.classList.add('right');else if(x.dataset.o===q.state.sel)x.classList.add('wrong');});}
function judge(q,val){ // geeft {ok, msg, empty}
 if(q.type==='mc'){if(val==null)return {empty:true};return {ok:val===q.answer,msg:val===q.answer?'':`Je koos "${val}". ${gloss(val)&&gloss(val)!==gloss(q.answer)?'Dat is: '+gloss(val)+' ':''}`};}
 if(q.type==='num'){const v=parseNum(val);if(v===null)return {empty:true};const ok=Math.abs(v-q.answer)<=(q.tol||1e-9);return {ok,msg:ok?'':(q.diag&&q.diag(v))||'Dat getal klopt niet. Volg het stappenplan.'};}
 if(q.type==='order'){if(!val||val.length<q.items.length)return {empty:true};const ok=val.every((x,i)=>x===q.items[i]);let first=val.findIndex((x,i)=>x!==q.items[i]);return {ok,msg:ok?'':`Stap ${first+1} klopt niet: daar hoort "${q.items[first]}".`};}}
function checkQ(e){const q=Q[e.id];const box=$('#qBox');if(q.state.done){$('#qFb').innerHTML=`<div class="fb sol">Deze opgave is afgerond. Klik op "Nieuwe opgave".</div>`;return;}
 let val=q.type==='mc'?q.state.sel:q.type==='order'?q.state.order:$('#qIn').value;
 const r=judge(q,val);
 if(r.empty){$('#qFb').innerHTML=`<div class="fb hint">${q.type==='mc'?'Kies eerst een antwoord.':q.type==='order'?'Klik eerst alle stappen aan.':'Vul eerst een antwoord in.'}</div>`;return;}
 q.state.done=true;const p=S.prog[e.id]=S.prog[e.id]||{ok:0,tries:0};p.tries++;
 if(r.ok){p.ok++;}
 save();markMC(q,box);const inp=$('#qIn');if(inp)inp.classList.add(r.ok?'good':'bad');
 $('#qFb').innerHTML=r.ok?`<div class="fb ok"><b>Juist!</b> ${esc(q.why)}${p.ok===NEED?'<br><b>Deze oefening is in orde voor de toets.</b>':''}</div>`:`<div class="fb no"><b>Niet juist.</b> ${esc(r.msg)}<br><b>Juist:</b> ${esc(ansText(q))}. ${esc(q.why)}</div>`;
 // navigatie-teller bijwerken
 const nb=document.querySelector(`.navbtn[data-ex="${e.id}"] .pill`);if(nb){nb.className='pill '+(p.ok>=NEED?'ok':'todo');nb.textContent=(p.ok>=NEED?'✓ ':'')+p.ok+'/'+NEED;}
 const sm=document.querySelector('#exPanel .small b');if(sm)sm.textContent=p.ok;updLock();}

/* ---------- controlecode ---------- */
const SALT='TRAAG-sleutelboek-2026';
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function hashStr(s){let h=0x811c9dc5;s=s+'#'+SALT;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}let h2=0x12345678;for(let i=s.length-1;i>=0;i--){h2^=s.charCodeAt(i);h2=Math.imul(h2,0x5bd1e995)>>>0;}return (h.toString(36)+h2.toString(36)).toUpperCase();}
const PARTS_T=['H1','H2','H3','H4','H5','H6','H7','H8','H9','P'];
const PLAN={H1:[['E1',1],['ET',2]],H2:[['E2',3]],H3:[['E3',2],['E4',2]],H4:[['E5',3]],H5:[['E6',3]],H6:[['E7',4]],H7:[['E8',3]],H8:[['E9',3]],H9:[['ES',3]],P:[['E10',1]]};
const PMAX={H1:3,H2:3,H3:4,H4:3,H5:3,H6:4,H7:3,H8:3,H9:3,P:1};
const NQ=Object.values(PMAX).reduce((a,b)=>a+b,0);
const BASE=5,EPOCH=Date.UTC(2026,0,1);
function makeCode(naam,klas,parts,dateStr,mins,poging,leaves){let pp=0;parts.forEach(x=>pp=pp*BASE+x);const days=Math.round((Date.UTC(+dateStr.slice(0,4),+dateStr.slice(5,7)-1,+dateStr.slice(8,10))-EPOCH)/864e5);
 let n=(((pp*4096+Math.max(0,Math.min(4095,days)))*256+Math.max(0,Math.min(255,mins)))*16+Math.max(0,Math.min(15,poging||1)))*16+Math.max(0,Math.min(15,leaves||0));const body=n.toString(36).toUpperCase();const chk=hashStr(norm(naam)+'|'+norm(klas)+'|'+body).slice(0,5);return body+'-'+chk;}
function readCode(naam,klas,code){code=String(code||'').trim().toUpperCase().replace(/\s/g,'');const m=code.match(/^([0-9A-Z]+)-([0-9A-Z]{5})$/);if(!m)return {ok:false,why:'De code heeft niet de juiste vorm (bv. 1ABC2DEF-XY12Z).'};
 const chk=hashStr(norm(naam)+'|'+norm(klas)+'|'+m[1]).slice(0,5);let n=parseInt(m[1],36);const leaves=n%16;n=Math.floor(n/16);const poging=n%16;n=Math.floor(n/16);const mins=n%256;n=Math.floor(n/256);const days=n%4096;n=Math.floor(n/4096);let pp=n;const parts=[];for(let i=0;i<PARTS_T.length;i++){parts.unshift(pp%BASE);pp=Math.floor(pp/BASE);}const total=parts.reduce((a,b)=>a+b,0);
 const d=new Date(EPOCH+days*864e5);const ok=chk===m[2]&&pp===0&&parts.every((x,i)=>x<=PMAX[PARTS_T[i]]);
 return {ok,why:ok?'':'De code past niet bij deze naam en klas (let op spelling) of werd aangepast.',total,parts,date:d.toISOString().slice(0,10),mins,poging,leaves};}

/* ---------- Eindtoets ---------- */
function buildToets(){const qs=[];PARTS_T.forEach(p=>PLAN[p].forEach(([id,n])=>{const e=EX.find(x=>x.id===id);const seen=new Set(qs.map(q=>q.prompt));let c=0,g=0;while(c<n&&g<300){g++;let q=toMC(e.gen());if(q.type==='order'&&qs.some(x=>x.type==='order'))continue;if(seen.has(q.prompt))continue;seen.add(q.prompt);q.part=p;q.ans=null;if(q.type==='order')q.pool=shuffle(q.items);qs.push(q);c++;}}));
 return shuffle(qs);}
const PR=q=>q.prompt.includes('<br>')?q.prompt:esc(q.prompt).replace(/&lt;b&gt;|&lt;\/b&gt;/g,m=>m.includes('/')?'</b>':'<b>');
function renderToets(){const t=S.toets;
 if(t&&t.finished)return renderRapport(t);
 if(t&&!t.finished)return renderToetsVraag(t);
 const open=toetsOpen();const list=REQ.map(id=>{const e=EX.find(x=>x.id===id);const n=okCount(id);return `<li><span>${esc(e.title)}</span><span class="pill ${n>=NEED?'ok':'todo'}">${n>=NEED?'✓ klaar':n+'/'+NEED}</span></li>`;}).join('');
 return `<section class="panel"><p class="eyebrow">Eindtoets</p><h2>${NQ} vragen over alle hoofdstukken</h2><p class="lead">Meerkeuzevragen en hooguit één volgordevraag, geen open vragen. Tijdens de toets zijn Theorie, Oefenen en Praktijk gesloten. Alles wordt automatisch verbeterd. Je kan terugbladeren tot je inlevert. Op het einde krijg je een rapport met een controlecode: neem er een screenshot van.</p>
 ${open?`<p class="msg ok">De toets is open${S.unlocked&&!allDone()?' (ontgrendeld door de leerkracht)':''}.</p>`:`<div class="lockbox"><b>De toets is nog op slot.</b><span>Maak eerst elke oefening in Oefenen met minstens ${NEED} juiste antwoorden.</span></div>`}
 <ul class="checklist">${list}</ul>
 <div class="grid2"><div class="field"><label for="t_naam">Voornaam en naam</label><input type="text" id="t_naam" value="${esc(S.naam)}" autocomplete="name"></div><div class="field"><label for="t_klas">Klas</label><input type="text" id="t_klas" value="${esc(S.klas)}"></div></div>
 <div class="row"><button class="btn acc" id="tStart" type="button" ${open?'':'disabled'}>Start de eindtoets</button><span id="tMsg" class="small"></span></div></section>`;}
function renderToetsVraag(t){const i=t.i;const q=t.qs[i];const answered=t.qs.filter(x=>x.ans!=null&&!(Array.isArray(x.ans)&&x.ans.length<x.items.length)).length;let inp='';
 if(q.type==='mc')inp=`<div class="opts">${q.options.map(o=>`<button class="opt" type="button" data-o="${esc(o)}" aria-pressed="${q.ans===o}">${esc(o)}</button>`).join('')}</div>`;
 else {const ord=q.ans||[];inp=`<ol class="chosen">${ord.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="ordersel">${q.pool.map(x=>`<button type="button" data-i="${esc(x)}" ${ord.includes(x)?'disabled':''}>${esc(x)}</button>`).join('')}</div><div><button class="btn ghost" type="button" id="tOrdClr">Wis volgorde</button></div>`;}
 return `<section class="panel"><div class="row" style="justify-content:space-between"><p class="eyebrow">Eindtoets · vraag ${i+1} van ${t.qs.length}</p><span class="small">${esc(t.naam)} · ${esc(t.klas)} · ${answered} beantwoord</span></div>
 <div class="progress"><i style="width:${Math.round((i+1)/t.qs.length*100)}%"></i></div>
 <div class="q"><p class="prompt">${PR(q)}</p>${inp}</div>
 <div class="row"><button class="btn ghost" id="tPrev" type="button" ${i===0?'disabled':''}>Vorige</button>${i<t.qs.length-1?`<button class="btn" id="tNext" type="button">Volgende</button>`:''}<button class="btn acc" id="tEnd" type="button">Inleveren</button></div><div id="tConfirm"></div></section>`;}
function bindToets(){const t=S.toets;
 if(!t){const st=$('#tStart');const nm=$('#t_naam'),kl=$('#t_klas');nm.oninput=()=>{S.naam=nm.value;save();};kl.oninput=()=>{S.klas=kl.value;save();};
  st.onclick=()=>{if(!nm.value.trim()||!kl.value.trim()){$('#tMsg').textContent='Vul eerst je naam en klas in.';return;}S.pogingen=(S.pogingen||0)+1;S.toets={poging:S.pogingen,leaves:0,naam:nm.value.trim(),klas:kl.value.trim(),start:Date.now(),qs:buildToets(),i:0,finished:false};save();render();};return;}
 if(t.finished){const b=$('#tReview');if(b)b.onclick=()=>{$('#reviewBox').hidden=!$('#reviewBox').hidden;};const n=$('#tNew');if(n)n.onclick=()=>{$('#newConfirm').innerHTML=`<p class="msg warn">Een nieuwe toets vervangt dit rapport op dit toestel. Heb je al een screenshot? <button class="btn ghost" id="tNewYes" type="button">Ja, nieuwe toets</button></p>`;$('#tNewYes').onclick=()=>{S.toets=null;save();render();};};return;}
 const q=t.qs[t.i];const box=$('#main');
 box.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{q.ans=o.dataset.o;save();box.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===o?'true':'false'));});
 box.querySelectorAll('.ordersel button').forEach(b=>b.onclick=()=>{q.ans=(q.ans||[]).concat(b.dataset.i);save();render();});
 const oc=$('#tOrdClr');if(oc)oc.onclick=()=>{q.ans=[];save();render();};
 $('#tPrev').onclick=()=>{t.i--;save();render();};const nx=$('#tNext');if(nx)nx.onclick=()=>{t.i++;save();render();};
 $('#tEnd').onclick=()=>{const open=t.qs.filter(x=>x.ans==null||x.ans===''||(Array.isArray(x.ans)&&x.ans.length<x.items.length)).length;
  $('#tConfirm').innerHTML=`<div class="lockbox"><b>${open?`Je hebt nog ${open} vraag/vragen niet (volledig) beantwoord.`:'Alle vragen zijn beantwoord.'}</b><span>Na inleveren kan je niets meer veranderen.</span><div class="row"><button class="btn acc" id="tEndYes" type="button">Ja, lever in</button><button class="btn ghost" id="tEndNo" type="button">Nog even nakijken</button></div></div>`;
  $('#tEndNo').onclick=()=>{$('#tConfirm').innerHTML='';};$('#tEndYes').onclick=()=>finishToets();};}
function finishToets(){const t=S.toets;t.end=Date.now();const parts={};PARTS_T.forEach(p=>parts[p]=0);
 t.qs.forEach(q=>{const r=q.ans==null?{ok:false}:judge(q,q.ans);q.ok=!!(r&&r.ok);if(q.ok)parts[q.part]++;});
 t.parts=PARTS_T.map(p=>parts[p]);t.total=t.parts.reduce((a,b)=>a+b,0);const d=new Date(t.start);t.date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;t.mins=Math.max(0,Math.round((t.end-t.start)/60000));
 t.code=makeCode(t.naam,t.klas,t.parts,t.date,t.mins,t.poging,t.leaves);t.finished=true;save();render();window.scrollTo(0,0);}
function renderRapport(t){const st=new Date(t.start),en=new Date(t.end);const hm=d=>d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
 const dur=Math.round((t.end-t.start)/1000);const durTxt=`${Math.floor(dur/60)} min ${String(dur%60).padStart(2,'0')} s`;
 const rows=PARTS_T.map((p,i)=>`<tr><td>${p==='P'?'Praktijk':p} · ${esc(CH[p].replace('Praktijk: ',''))}</td><td class="num">${t.parts[i]} / ${PMAX[p]}</td><td style="width:30%"><div class="bar"><i style="width:${Math.round(t.parts[i]/PMAX[p]*100)}%"></i></div></td></tr>`).join('');
 const review=t.qs.map((q,i)=>`<div class="fb ${q.ok?'ok':'no'}"><b>${i+1}. ${q.ok?'Juist':'Fout'}</b> · ${PR(q)}<br>Jouw antwoord: ${esc(q.ans==null||q.ans===''?'(leeg)':Array.isArray(q.ans)?q.ans.map((x,j)=>(j+1)+'. '+x).join(' '):q.ans)}${q.ok?'':`<br>Juist: ${esc(ansText(q))}. ${esc(q.why)}`}</div>`).join('');
 return `<section class="panel"><div class="report"><div><p class="eyebrow">Rapport eindtoets · PC werkt traag</p><h2>${esc(t.naam)}</h2></div>
 <dl class="kv"><dt>Klas</dt><dd>${esc(t.klas)}</dd><dt>Datum</dt><dd>${st.toLocaleDateString('nl-BE')}</dd><dt>Tijd</dt><dd>${hm(st)} – ${hm(en)}</dd><dt>Duur</dt><dd>${durTxt}</dd><dt>Poging</dt><dd>${t.poging||1}</dd><dt>Toets verlaten</dt><dd>${t.leaves||0} keer (ander tabblad of venster)</dd><dt>Score</dt><dd style="font-size:22px">${t.total} / ${NQ} (${Math.round(t.total/NQ*100)} %)</dd></dl>
 <div class="tbl"><table><tr><th>Onderdeel</th><th>Score</th><th>Grafiek</th></tr>${rows}</table></div>

  $('#tkReset').onclick=()=>{$('#tkRes').innerHTML=`<p class="msg warn">Alles wissen (oefeningen, praktijk, toets)? <button class="btn ghost" id="tkResYes" type="button">Ja, wis</button></p>`;$('#tkResYes').onclick=()=>{S={naam:'',klas:'',prog:{},unlocked:false,prak:{},toets:null,lastTab:'theorie'};save();close();render();};};};}
